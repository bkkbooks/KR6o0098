body:
  text: 馬鳴菩薩造真諦三藏譯繫縛地地品類不吉祥道路大決擇分第二十七如是已説摩訶寶輪王廣大圓滿無上地地大決擇分次當説繫縛地地品類不吉祥道路大決擇分其相云何偈曰繫縛道路中亦有金剛位依位立轉相則有四種法謂能所障果如是四種法皆悉有為量如法應觀察論曰就繫縛地地品類不吉祥道路分中亦有五十一金剛位依此諸位建立轉相有四種法云何為四一者能證智法二者所證理法三者障礙事法四者證得果法是名為四如是四法皆有為量應審思擇如偈繫縛道路中亦有金剛位依位立轉相則有四種法謂能所障果如是四種法皆悉有為量如法應觀察故如是四法各有幾數其轉形相當如何耶偈曰各有二種法謂本始體相生滅及增減轉相唯上上論曰四種法中各有二種云何二智一者本古性德智二者始今起德智是名為二云何二理一者體有實理二者相有實理是名為二云何二障一者本生本生障二者本滅本滅障是名為二云何二果一者增長功德果二者損減過患果是名為二如偈各有二種法謂本始體相生滅及增減故修行轉相唯上上故如偈轉相唯上上故障治證果對量差別形相如何偈曰本生體增對始滅相減對從多亦通了如法應觀察論曰本古性德智斷除本生本生障證得體有實理成就增長功德果如偈本生體增對故始今起德智斷除本滅本滅障證得相有實理成就損減過患果如偈始滅相減對故如是四法五十一種真金位中皆悉具足應審思擇唯一向轉俱種轉耶俱種轉故如偈從多亦通了如法應觀察故生滅二障業用差別形相如何偈曰本主生滅時勝生勝滅故論曰功德善根出興對治轉勝出興轉勝對滅作逆事故如偈本主生滅時勝生勝滅故故大金剛山寶海會衆修多羅中作如是説復次文殊師利汝前所問云何名為諸法無常一道一種第一轉門者以四無常故我作如是唱云何為四一者智無常二者理無常三者無常無常四者上果無常是名為四文殊師利言智無常者斷煩惱故言理無常者智所證故言無常無常者被斷除故言果無常者待因力故乃至廣説故繫縛地地自然本王摩訶縯品大決擇分第二十八如是已説繫縛地地品類不吉祥道路大決擇分次當説繫縛地地自然本王摩訶縯品大決擇分其相云何偈曰自然本王中有為無為法具足圓滿轉此中具上下論曰就自然本王摩訶縯品分中則有二轉云何為二一者有為轉二者無為轉是名為二如偈自然本王中有為無為法具足圓滿轉故亦有二轉云何為二一者上轉二者下轉是名為二如偈此中具上下故有為無為各有幾數上下轉相當如何耶偈曰無為唯有一有為有二種如次實本始上下無為主出生二有為轉勝廣大轉論曰無為有一有為有二一謂有實故二謂本始故如偈無為唯有一有為有二種如次實本始故如是三法五十一種金剛位中亦上亦下增長功德轉相云何謂上時中一一位位無為法主皆悉各各出生增長一萬本始清妙覺慧其下時中一一位位皆悉各各二億本始清妙覺慧具足圓滿出生增長如是如是如如上下至小無量如説本存眷屬亦爾如偈上下無為主出生二有為轉勝廣大轉故如其次第增數應知品地經論修多羅中作如是説世間藏地本王海中無常功德衆多無數常住功德其數微少是故説言世間藏地乃至廣説故
