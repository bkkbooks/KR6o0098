body:
  text: 馬鳴菩薩造真諦三藏譯摩訶空塵海藏王道路大決擇分第三十五如是已說廣大無盡解脫海海摩訶山王大決擇分次當說摩訶空塵海藏王道路大決擇分其相云何偈曰海王道路中具足百自在以此因緣故建立海王名論曰今此偈中為明何義為欲現示海王藏中無有別法唯有自在故有幾自在謂百種故云何為百一者時自在三十二法亦一時轉亦異時轉亦轉時中不轉亦不轉時中轉亦遠時轉亦近時轉乃至無量故二者處自在一異等處轉乃至無量故三者物自在為同異等用乃至無量故四者周遍自在無所不通等乃至無量故五者大小自在極重極微等乃至無量故六者有無自在亦現亦隱等乃至無量故七者寂動自在亦定亦散等乃至無量故八者甚深自在不可思議等事乃至無量故九者不自在自在以逆等事乃至無量故十者無礙自在以逆順事等乃至無量故乃至第百自在自在無盡自在等皆悉自在乃至無量故如前所說三十二法如是自在具足圓滿無闕失轉以此義故立海王名應審思擇如偈海王道路中具足百自在以此因緣故建立海王名故覺花修多羅中作如是說第一廣分大海門中若廣說有一十方世界之塵量自在若略說有一百自在乃至廣說故大不可思議重重不可稱量阿說本王大決擇分第三十六如是已說摩訶空塵海藏王道路大決擇分次當說大不可思議重重不可稱量阿說本王大決擇分其相云何偈曰阿說本王中有十方塵量十方空塵量三十三法海論曰今此偈中為明何義為欲現示阿說海中具足圓滿十方世界之塵數十方世界之塵數三十三法海十方世界之塵數十方虛空之塵數三十三法海故如偈阿說本王中有十方塵量十方空塵量三十三法海故本王修多羅中作如是說爾時世尊告大衆言我以三達智通達一切法無所障礙無所闕失而有一海不可思議不可思議不能窮了謂空塵本王性德圓滿自在自在無盡藏海乃至廣說故
