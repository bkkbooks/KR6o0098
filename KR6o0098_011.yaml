body:
  text: 馬鳴菩薩造真諦三藏譯𭺕尸梵諾本王道路大決擇分第二十一如是已説𭺔𣅍陀尸梵迦諾本王本地大決擇分次當説𭺕尸梵諾本王道路大決擇分其相云何偈曰本王道路中有三種千變名如前説量各初變如次增百千萬億各後一切變如次倍數轉住心應觀察論曰就𭺕尸梵諾本王道路分中則有三種千變修行其名次第同前所説如偈本王道路中有三種千變名如前説量故如是三種第一變中如其次第增百億千億萬億數上下一量漸漸轉故如偈各初變如次增百千萬億故各後諸變如其次第增倍數轉應審思擇如偈各後一切變如次倍數轉住心應觀察故則修多羅中作如是説如來藏佛上下門中有三種修行數以千為量如是三品以多億轉出生增長廣大周遍法門海藏乃至廣説故摩訶𭺕尸梵諾母原主天王大決擇分第二十二如是已説𭺕尸梵諾本王道路大決擇分次當説摩訶𭺕尸梵諾母原主天王大決擇分其相云何偈曰摩訶天王中有三種億變名次第如前各初變如次一二三十方世界數量轉所餘一切變如次倍數轉論曰就摩訶主天王體中則有三種億變修行名字次第同前所説如偈摩訶天王中有三種億變名次第如前故如是三種第一變中如其次第增一十方二十方三十方數轉如偈各初變如次一二三十方世界數量轉故餘一切變如其次第倍數轉故如偈所餘一切變如次倍數轉故總字法轉大輪修多羅中作如是説佛陀摩訶本藏王地地中則有三行云何為三一者下億轉行二者中億轉行三者上億轉行初行出生一大方界量下眷屬海中行出生二大方界量等俱轉海後行出生三大方界量上眷屬海乃至廣説故
