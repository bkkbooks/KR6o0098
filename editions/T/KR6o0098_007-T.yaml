body:
  text: 馬鳴菩薩造真諦三藏譯不可思議俱俱微塵一切山王道路大決擇分第十三如是已說不可思議不可稱量俱俱微塵本大山王大決擇分次當說不可思議俱俱微塵一切山王道路大決擇分其相云何偈曰微塵道路中有十方界量五十一本位名與前說等一五十一中一一皆各各有十方界量障治三寶海如一餘亦爾配此應了知論曰就俱俱微塵道路中則有一十方世界之數量五十一根本位其名字量與前說等無有差別如偈微塵道路中有十方界量五十一本位名與前說等故就一五十一種位中一一各各有十方世界之數量煩惱大海對治大海僧寶大海法寶大海佛寶大海具足轉故如偈一五十一中一一皆各各有十方界量障治三寶海故如說一五十一種位餘一切位亦復如是如偈如一餘亦爾配此應了知故如是已說現示本體安立門次當說現示上末轉相門其相云何偈曰今此道路佛出興小無量法及化大海第二轉覺者出興中無量法及化大海第三轉覺者出興大無量法及化大海後後諸轉中如次第無超漸漸增數量論曰依一本信出興覺者總有一十方世界之數量其中一佛成道已訖則便出興小無量十方世界之微塵數量無礙自在化身大海如是數量信心大海如偈今此道路佛出興小無量法及化大海故依此佛身出興化身總有小無量十方世界之微塵數量其中一佛出興已訖則便出興中無量十方世界之微塵數量無礙自在化身大海如是數量信地大海如偈第二轉覺者出興中無量法及化大海故依此化身出興化身總有中無量十方世界之微塵數量其中一佛出興已訖則便出興大無量十方世界之微塵數量無礙自在化身大海如是數量信地大海如偈第三轉覺者出興大無量法及化大海故如是如是隨隨如如後諸轉中如次無超漸漸增數如偈後後諸轉中如次第無超漸漸增數量故舉此一隅應廣通達本品足地智修多羅中作如是說大地微塵譬喻大海履行無住法門第一轉中小無量大方微塵之數品第二轉中中無量品第三轉中大無量品第四轉中無邊無量品第五轉中無數無量品第六轉中無量無量品第七轉中不可計量無量品第八轉中具足無量品第九轉中不可說無量品第十轉中不可思議無量品乃至廣說故一切虛空一切微塵數量高王大決擇分第十四如是已說不可思議俱俱微塵一切山王道路大決擇分次當說一切虛空一切微塵數量高王大決擇分其相云何偈曰虛空微塵中則有十方量十方塵空量五十一本位一五十一中一一皆各各有如前說量障治三寶海論曰就一切虛空一切微塵數量高王分中則有十方世界之塵量十方世界之塵量五十一種根本位十方世界之塵量十方虛空之塵量五十一種根本位如偈虛空微塵中則有十方量十方塵空量五十一本位故就一五十一種根本位中一一各各有十方世界之塵量十方世界之塵量十方世界之塵量十方虛空之塵量煩惱大海對治大海僧寶大海法寶大海佛寶大海具足轉故如偈一五十一中一一皆各各有如前說量障治三寶海故如是已說現示本體安立門次當說現示上末轉相門其相云何偈曰此本王覺者前數倍十重興化宣說法大聰明能了後後諸轉中如次第無超漸漸增數量轉勝廣大轉論曰今此門中為明何義為欲現示依一本信出興覺者其中一佛譬喻譬喻之數量增益十重出興變化宣說信地後後轉中漸漸增數百千萬億乃至無量無窮盡故如偈此本王覺者前數倍十重興化宣說法大聰明能了後後諸轉中如次第無超漸漸增數量轉勝廣大轉故地智修多羅中作如是說可一總持大周遍王之自體轉相無量無邊譬喻量說轉化時中漸增數量滿玄數量乃至廣說故
