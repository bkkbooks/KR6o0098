body:
  text: 馬鳴菩薩造真諦三藏譯獨一無二山王自在道路大決擇分第十七如是已說獨地獨天一種廣大無二山王大決擇分次當說獨一無二山王自在道路大決擇分其相云何偈曰自在道路中總有千重轉謂本上一中各各五百故論曰就此無二山王自在道路分中總有千重差別轉相所謂本上中各各五百故如偈自在道路中總有千重轉謂本上一中各各五百故故本轉形相當如何耶偈曰向本一下轉一空一有轉乃至第五百餘位亦如是論曰今此偈中為明何義為欲現示依本一門向下下轉有一金剛空一金剛如其次第一一現前漸漸轉入乃至第五百如是亦復餘諸位中漸漸轉入乃至第五百無有窮盡無有邊際無有始終具足具足圓滿廣大常恒轉故如偈向本一下轉一空一有轉乃至第五百餘位亦如是故上轉形相例此應知因明性德修多羅中作如是說無二一天父子法藏上上轉去有其始終無有窮盡下下轉入有其始終無有窮盡有始終者從信等位起至五百量故無窮盡者法藏之海極廣大故乃至廣說故摩訶無二山王最勝高頂一地大決擇分第十八如是已說獨一無二山王自在道路大決擇分次當說摩訶無二山王最勝高頂一地大決擇分其相云何偈曰本上無窮盡建立如是名所餘一切位亦如是應知論曰今此偈中為明何義為欲現示本本無窮上上無窮本上無窮上本無窮一一無窮多多無窮同同無窮異異無窮等等無窮別別無窮有窮無窮無窮無窮周遍廣大具足圓滿故如偈本上無窮盡建立如是名所餘一切位亦如是應知故摩訶衍海修多羅中作如是說禪定摩訶衍海中一千二百無窮盡品具足俱轉乃至廣說故
