body:
  text: 馬鳴菩薩造真諦三藏譯校量功德讚歎信行現示利益大決擇分第三十七如是已說大不可思議重重不可稱量阿說本王大決擇分次當說校量功德讚歎信行現示利益大決擇分其相云何偈曰譬如盛火聚雖有極遠處以光明勢力能破遠方暗此玄文本論亦復如如是若有衆生類同世界共住雖未得見學此論火光明能破遠衆生心相不覺暗令得覺知明隨分伏其染譬如盛火聚轉勝近其處光明漸漸了能破暗更增此玄文本論亦復如如是若有衆生類同一國共住雖未得見學此論火光明除衆生無知轉轉令分明譬如盛火聚轉轉近其處光明耀更增此玄文本論亦復如如是若有衆生類同一城共住雖未得見學此論火光明除衆生無知轉轉更分明譬如盛火聚更轉近其處光明重重增暖氣溫其身此玄文本論亦復如如是若有衆生類同一家共住雖未得見學此論火光明除心惑護身轉轉增長故譬如有一人得彼大火聚此人則便得六種大利益謂能塞寒氣能成熟資具不入毒蟲等破暗常明了隨請人普施焚燒穢糞等此玄文本論亦復如如是若有衆生類得此玄文論此人即便得六種大利益謂禁煩惱軍成就功德品不入邪魔衆破無明品類般若慧現前貧窮佛法財來乞求衆生隨順普施與燒滅煩惱糞比如有妙花水深池中名曰青蓮花有人剎那中見此蓮花相一百七日中其眼根清白終日無晦濁此玄文本論亦復如如是若有衆生類雖不知此論文義之大海而目見此論其眼根清淨見三世諸佛有作方便目比如有天鼓懸圓生樹頂名曰妙聲覺無量天女子聞此鼓音已二千七日中其耳根清速無塞隔之事此玄文本論亦復如如是若有衆生類雖不知文義而耳聞此論其耳根清淨聞諸佛梵響有作方便耳比如有妙藥生雪山之頂名曰上味常有人取此藥著其舌之原身香極芬芬不承用飲食其命極長遠亦飛騰虛空此玄文本論亦復如如是若有衆生類此論中一字一句若一行若一決擇分若一卷之量以舌經讀誦雖不知義理而獲得一切諸修多羅海經讀誦功德比如有菩薩名曰不思議大力解脫者此菩薩大士神通自在故於一切所作皆無所障礙隨應悉現前此玄文本論亦復如如是若有諸衆生觀達其義理覺悟文下詮通達一切法皆無所障礙一一覺分明比如有神王名曰大安樂有人須小具祀祠此神王出興七寶藏令得大安樂此玄文本論亦復如如是若有一男女此玄文本論勤受持讀誦有人須小具專心供此人即得無窮盡福德智慧寶無所疑畏心比如有妙香名曰芬滿布有人持此香遊行於遠方其經過處處七七日中間有香氣不盡此玄文本論亦復如如是若有一男女荷擔此論部遊行於遠方若度大海水所有諸衆生皆得大利益若度山野等所有諸衆生亦得大利益譬如有妙珠名曰如意寶隨此珠住處無量眷屬玉遍周匝圍繞此玄文本論亦復如如是隨其住止處有十方世界塵量大神王一一大神王各率十方界塵數眷屬神守護此論珠若滅正法時作微塵散壞所有諸神王發大聲哭涕隨塵所住處往詣常守護受持此論者如是數量神若生若死後常不離守護功德雖無量而略說如是校量過患呵責誹謗現示罪業大決擇分第三十八如是已說校量功德讚歎信行現示利益大決擇分次當說校量過患呵責誹謗現示罪業大決擇分其相云何偈曰譬如有一山名曰寶輪上此山具七寶更無有窮盡貧窮求寶類無量無邊數有珠能禁寶名曰頂玻瓈若人有此珠則能取七寶遠離貧窮苦獲得大安樂若人無此珠不能寶禁故終日不能得問所以者何若無珠人詣唯見虎狼熊及赤蛇青蛇種種雜毒蟲終不見珍寶以見毒類故其心極疑怖狂亂而馳走乃至于死滅珍寶自然有而彼求珍人福薄罪重故終不能見得衆生亦如是善根甚深人捧堅固信珠入大乘深海取功德之寶出生死苦輪善根微薄人得見甚深論無實信心故依正作邪解受苦輪無期譬如生盲人得妙莊嚴具無有歡樂事癡人亦如是雖得甚深論其愚癡極故不覺出世寶無有學習心譬如居井龍從流水至海大迷大亂故謗海而命終癡人亦如是自所習堅執定一不移轉聞未曾有法大迷大亂故誹謗其廣大墮落惡道中無有出離期若有衆生類見聞斯論教不信心誹謗此人則誹謗三世一切佛三世諸法藏三世諸僧海此人所得罪無量無量數不能知邊際十方界塵量諸佛大菩薩一時悉出現宣說如是量法門之大海專教化此人經過無量劫終不能教化問所以者何唯宣說此法無餘別道故如是衆生類十方界塵量諸佛大菩薩以大神通力向未來遠劫觀察其限界無覺道之期問所以者何不學三十四大金剛軌則到大涅槃岸無有是處故是故諸行者以勤修方便應觀其法海不能達其原妄生誹謗心墮落惡道中無有出離期決定不應作決定不應作罪業雖無量而略說如是
