body:
  text: 馬鳴菩薩造真諦三藏譯自然本王廣大轉地無障無礙俱行道路大決擇分第二十九如是已說繫縛地地自然本王摩訶𦅂品大決擇分次當說自然本王廣大轉地無障無礙俱行道路大決擇分其相云何偈曰本王道路中依位漸漸轉一主生二伴至中無量故數變皆悉通如法應觀察論曰就自然本王廣大轉地無障無礙俱行道路分中依五十一位如其次第亦上亦下漸漸轉行無為法主生二有為若上若下增中無量數至中無量變故如偈本王道路中依位漸漸轉一主生二伴至中無量故數變皆悉通如法應觀察故部宗花品修多羅中作如是說行藏海中有一常德其數無量行藏海中有二無常功德品類其數無量亦升亦𢩹其數無量乃至廣說故最極廣大俱行山王無盡海海大決擇分第三十如是已說自然本王廣大轉地無障無礙俱行道路大決擇分次當說最極廣大俱行山王無盡海海大決擇分其相云何偈曰無盡海海中依位漸漸轉一主生二伴至大無量故數及變例前應廣通達焉論曰就無盡海海藏中依五十一位如其次第亦上亦下無為法主出生增長二有為法增大無量數至大無量變故如偈無盡海海中依位漸漸轉一主生二伴至大無量故數及變例前應廣通達焉故彼修多羅中作如是說行常山王海中有三種大無量云何為三一者常大無量二者無常大無量三者轉變大無量乃至廣說故
