body:
  text: 馬鳴菩薩造真諦三藏譯一種功德純純無雜大圓滿地道路大決擇分第二十三如是已説摩訶𭺕尸梵諾母原主天王大決擇分次當説一種功德純純無雜大圓滿地道路大決擇分其相云何偈曰功德道路中有二千五百五十法門海五十一位中一一皆各各具五十位故亦一一位中有性相本末一萬二百數修多羅中説總一萬二千七百五十數取彼總本數如法應觀察以如是數量為道路分界論曰就一種功德純純無雜大圓滿地道路分中總有二千五百五十法門大海甚深甚深廣大廣大如偈功德道路中有二千五百五十法門海故以何義故數如是成應可了知所謂五十一種位中一一各各具五十故此義云何所謂五十信心五十念心乃至五十如來地各差別故如偈五十一位中一一皆各各具五十位故故亦一一位位各各具足性相本末之四法故一萬二百數成立而已如是四事云何差別謂如其次第不可思議説故明了現覺説故能生長因説故所生長果説故如偈亦一一位中有性相本末一萬二百數故若爾此方説文云何通耶謂金剛等地一行三昧修多羅中作如是説無雜無亂一一同同非惡非患吉祥地地軌則門中總有一萬二千七百五十法門彼修多羅中如是説者總別總故如偈修多羅中説總一萬二千七百五十數取彼總本數如法應觀察故今此道路以之為量有別法門唯以此數為其極量無別法門如偈以如是數量為道路分界故一種功德摩訶本地明白離惡品藏大決擇分第二十四如是已説一種功德純純無雜大圓滿地道路大決擇分次當説一種功德摩訶本地明白離惡品藏大決擇分其相云何偈曰本地品藏中有一億三萬七千五百數廣大法門海前説諸位中一一皆各各攝別五十位法門如是廣性相本末四例此廣通達論曰就一種功德摩訶本地明白離惡品藏中總有一億三萬七千五百數廣大法門海甚深甚深周遍周遍如偈本地品藏中有一億三萬七千五百數廣大法門海故以何義故數如是成如前所説一切位中一一各各攝差別轉五十位故法門之海如是廣大如偈前説諸位中一一皆各各攝別五十位法門如是廣故性相本末四種事中以例配當更復增數轉勝廣大應審思擇如偈性相本末四例此廣通達故
