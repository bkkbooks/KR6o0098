body:
  text: 馬鳴菩薩造真諦三藏譯摩訶本地具足品藏非患道路大決擇分第二十五如是已說一種功德摩訶本地明白離惡品藏大決擇分次當說摩訶本地具足品藏非患道路大決擇分其相云何偈曰本地道路中則有二種門謂橫轉竪轉以之為門量論曰就摩訶本地具足品藏非患道路分中則有二門云何為二一者橫轉遍到俱行門二者竪轉無雜一路門是名為二如是二門以為門量如偈本地道路中則有二種門謂橫轉竪轉以之為門量故且橫轉門形相如何偈曰四種事位中有總及別中各增十重轉無前後一時其法門數量例前應了知論曰今此偈中為明何義為欲現示性相本末四種事中各各有總別之位中一一位位皆悉各各增十重數無前無後一時俱轉則是橫轉遍到俱行門形相故如偈四種事位中有總及別中各增十重轉無前後一時故此中數量亦復轉勝超過前量配例應了如偈其法門數量例前應了知故如是已說橫轉遍到俱行門次當說竪轉無雜一路門其相云何偈曰前說諸位中如次不超過各增十重轉一明究竟故論曰今此偈中為明何義為欲現示如前所說總別位中如其次第無有超過一一各各增十重轉一事明了一事究竟亦無雜亂亦無合集一向明轉竪轉無雜一路門形相故如偈前說諸位中如次不超過各增十重轉一明究竟故故大金剛寶王法界印藏修多羅中作如是說復次文殊師利寶王道品者以二事轉云何為二一者一區轉二者具面轉言一區者道雖廣多先一道量永究竟故言具面者所有諸道一時行故乃至廣說故摩訶寶輪王廣大圓滿無上地地大決擇分第二十六如是已說摩訶本地具足品藏非患道路大決擇分次當說摩訶寶輪王廣大圓滿無上地地大決擇分其相云何偈曰總別無盡故建立本法體論曰今此偈中為明何義為欲現示本法體中以總攝別以別攝總以總攝總以別攝別能攝所攝無有窮盡法門大海甚深廣大義理詮趣周遍圓滿究竟自在故如偈總別無盡故建立本法體故摩訶衍地藏無上極說不可思議心地品論修多羅中作如是說寶山海中同類無盡別類無盡具足圓滿無有窮盡無有始終無有邊際無有分界亦廣大相亦小狹相乃至廣說故
