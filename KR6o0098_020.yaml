body:
  text: 馬鳴菩薩造真諦三藏譯現示本因決定證成除疑生信大決擇分第三十九如是已説校量過患呵責誹謗現示罪業大決擇分次當説現示本因決定證成除疑生信大決擇分其相云何偈曰我於往昔無量劫隨世尊修菩薩行一時世尊王家奴國名金水其王名寶金輪藏此大王有三十億奴婢類有六十億大白馬金銀等寶亦無盡有最下奴名常信於中大王告常信汝受此六十億馬不離守護令無傷爾時彼奴受諸馬常恆不離無傷護如是六十億白馬經一日食百兩金時常信作如是念我身唯一馬衆多難哉難哉無傷畜此諸馬惡馳難禁今何方便能護持常信作是念已訖則便依師學術方術力變作萬白馬六十億白馬中中𬽔𬽔𭡒𭡒立化馬發大聲作如是唱馬馬皆悉作禮拜爾時有中中化馬皆悉先前作禮拜餘諸馬皆隨禮拜作如是事已訖後化馬責小咎皆殺諸馬更皆伏從化常信所願悉成就都無所憂怪之心常信更復作是念此諸馬皆從我化除其為資具黃金造作善業易穢報告諸馬作如是唱諦聽諦聽諸畜生我身并及汝等身於過去世心負悔具作一切惡業障亦奴亦馬生此處恆一切時不自在病苦所逼飢寒亂一時不得其安樂若此生中不作善後世亦受如是報去去無有出離期如宜汝等諸畜生除自資具供德處須臾飢渴感長樂我人有思心欲修無其間間空過時況汝等畜生之身形穢心濁修何時如宜從我化無逆其國中有殊勝鳥名曰雅音聲覺悟此鳥聲不可思議人聞其音大悲慨爾時彼六十億馬聞常信所語已訖一時發大聲悲哭至十日量無休息如是諸馬其聲響與雅音聲覺悟鳥平等平等無差別爾時常信馬皆喜百兩金分為二分一分以為生長具一分以為福田分福田分五十兩金造作一金剛佛像總有六十億佛像最上第一大白馬名曰長嚴雜色見常信及諸馬皆死第二生中皆悉人同一眷屬不相離出家學道勤修行彼六十億出家人皆名馬鳴無別名從過去立名字故過去常信今釋迦彼時六十億白馬今時六十億馬鳴最第一馬雜色見今時中我身而已第三生中亦人身隨世尊行菩薩行第四生中亦得人隨世尊習忍辱行轉轉經過五百生次生中瞋因緣故得重蛇身受大苦次生中受大魚身次生中亦得蛇身以蛇身詣世尊所投體懺悔發慚愧以偈表意發大心次生中得人同分隨世尊發願繫屬則世尊作如是願我若成覺道圓滿宣説百億修多羅普利益廣略衆生我則作如是誓願造作一百釋明論分利益廣略衆生如次後後經多生世尊滿足行因海安住法界山王位我亦漸漸修因行證入第八不動地我則往詣世尊所稽首頂禮立一面爾時世尊告我言我念往昔無量劫汝我同住一處中發願作繫屬因緣如宜汝造作論教我滅度後興正法我則更頂禮和南向世尊作如是白我今不知作論法雅暗都無所覺達唯願世尊為迷子開曉造作論教法爾時世尊告我言善哉善哉善男子諦聽諦聽善思念我當為汝分別説善男子諸佛法藏無量無邊不説劫無窮盡亦無分界如是無量法藏海若廣説論若略説皆通該攝無餘持是名造作論教法我亦重疑更作請法門海無量無邊我今未滿福智海居學位中未究竟皆攝無餘持何得爾時世尊告我言法門大海雖無量有攝無量宗本法若具攝此宗本法是名説攝諸法藏我亦更作如是白云何名為宗本法其數幾有可知不爾時世尊告我言所言宗本法體者謂三十四法大海若有論者具此法名言圓滿大海論若有論者不具者名言一分小智論以如是大要因緣我今依三十四法該攝安立無餘説因緣品類雖無量而總言略説如是勸持流通發大願海大決擇分第四十如是已説現示本因決定證成除疑生信大決擇分次當説勸持流通發大願海大決擇分其相云何偈曰願此圓滿大海論遍不思議塵剎中出生無量般若日消除無邊無明暗轉作三寶之大海無非法而功德藏非請感周遍相應非勸策自然成就
