body:
  text: 馬鳴菩薩造真諦三藏譯出離繫縛地清白解脫道路大決擇分第三十一如是已說最極廣大俱行山王無盡海海大決擇分次當說出離繫縛地清白解脫道路大決擇分其相云何偈曰解脫道路中有二十無為謂十空十有如是諸無為五十一位中皆悉具足有依法位立轉有二重重超論曰就出離繫縛地清白解脫道路分中則有二十無為常法所謂十空十有無為各差別故云何名為十空無為一者廣大虛空自然常住離造作空無為二者大虛空影空無為三者虛空影影空無為四者破影無所有空無為五者空空俱非空無為六者離言絶說空無為七者絶離未畢空無為八者絶離心解空無為九者絶離窮窮空無為十者無障無礙大空大空空無為是名為十云何名為十有無為一者一切言說決定常住無破非空無為二者一切心識決定常住無破非空無為三者一切大種決定常住無破非空無為四者一切俱非決定常住無破非空無為五者一切有實決定常住無破非空無為六者一切性大決定常住無破非空無為七者一切今光決定常住無破非空無為八者一切有名決定常住無破非空無為九者一切無名決定常住無破非空無為十者廣大圓滿自性本有一切種有決定常住無破非空無為是名為十如偈解脫道路中有二十無為謂十空十有故如是二十種無為法五十一種金剛位中具足圓滿無闕失轉如偈如是諸無為五十一位中皆悉具足有故依如是等二十無為五十一位建立轉相則有二種云何為二一者重重該攝無障礙門二者次第亂轉超過門是名為二如偈依法位立轉有二重重超故且重重該攝無障礙門形相如何偈曰二十法一一各攝後二十五十一種位一一皆各各攝五十一位亦此相違攝以此因緣故建立重重名論曰云何名為重重門相謂該攝故云何該攝謂二十種無為常法信心具足一一各各攝後諸位各二十種無為法故如說信心餘位亦爾如偈二十法一一各攝後二十故五十一種位各攝五十一亦無障礙如偈五十一種位一一皆各各攝五十一位故亦一一法攝一切位一一位位攝一切法亦無障礙如偈亦此相違攝故以如是二種該攝門故立重重名如偈以此因緣故建立重重名故如是已說重重該攝無障礙門次當說次第亂轉超過門其相云何偈曰五十一位中隨一經五十漸漸增法數周遍廣大轉論曰今此偈中為明何義為欲現示五十一種金剛位中以信為初經五十位以發心住而為其初經五十位乃至以最極地而為其初經五十位若第一轉增四十一百數法位轉若第二轉增八十二百數法位轉乃至最後地故如偈五十一位中隨一經五十漸漸增法數周遍廣大轉故蘊高山王品類修多羅中作如是說無破地地門中有寂靜寶其數衆多空寂靜寶其數衆多若有行者入此門中通達諸法無為大道無所障礙無所疑畏其心自在決定常住大安樂漸漸增長常功德海乃至廣說故解脫山王根本地地無礙自在大決擇分第三十二如是已說出離繫縛地清白解脫道路大決擇分次當說解脫山王根本地地無礙自在大決擇分其相云何偈曰根本山王中空有互相生諸位相生故轉勝廣大轉論曰今此偈中為明何義為欲現示十空無為一一各各出生十有無為常法十有無為一一各各出生十空無為常法五十一位一一各各出生五十依重重等門圓滿廣大轉故如偈根本山王中空有互相生諸位相生故轉勝廣大轉故摩訶衍海修多羅中作如是說解脫海中亦有空有亦有有空其數衆多如是空有唯是常滅非無常量唯是功德非過患品是故說言解脫藏海乃至廣說故
