body:
  text: 馬鳴菩薩造真諦三藏譯一種金剛道路大決擇分第三如是已説歸依德處因緣大決擇分次當説一種金剛道路大決擇分其相云何偈曰一種金剛地總有五種位謂漸次究竟及圓滿等非并及等是位如是五種位諸修多羅中具足無餘説論曰一種金剛道路無礙本地地中總有幾位廣説雖無量略説有五種如是五位一切總則一切根本一切中藏一切出生如偈一種金剛地總有五種位故云何名為五種本位一者無超次第漸轉位二者無餘究竟總持位三者周遍圓滿廣大位四者一切諸法俱非位五者一切諸法俱是位是名為五種根本位如偈謂漸次究竟及圓滿等非并及等是位故如是五位自家宣説龜則方説如是五位直是方説非宣説量如偈如是五種位諸修多羅中具足無餘説故位所依止本數名字其相云何偈曰所依止本數總有五十一謂虛假光明四十種名字不動真金剛十種本名字及大極地故是名所依數論曰五種本位所依止之名字差別其數幾有廣説雖無量略説有五十一種名字如是五十一種根本名字一切天地一切父母一切體性一切所依如偈所依止本數總有五十一故云何名為五十一數所謂虛假光明分中有四十種真金剛中有十種數此五十中加大極自然陀羅尼地故是故成立五十一數名字分中四十種數當何等相所謂十種愛樂心十種識知心十種修道心十種不退心各差別故云何名為十愛樂心一者必叉多二者阿摩呵尸三者諦度毗梨耶四者和羅只度五者奢摩陀提尸六者摩訶阿毗跋致多七者阿羅婆訶尼八者婆𡄣多阿梨羅訶諦九者尸羅俱尸阿尸羅十者摩訶毗呵阿僧那是名為十云何名為十識知心一者留伽度二者留諦迦度三者留羅伽四者留摩訶五者安婆娑六者毗跋致七者阿毗跋致八者必叉伽九者必阿羅十者留山迦是名為十云何名為十修道心一者度伽呵二者度安爾三者度只羅四者度和差五者度利他六者度生婆諦七者度沙必八者度阿訶九者度佛阿十者度叉一婆是名為十云何名為十不退心一者羅諦流沙二者羅曇沙三者必自伽四者法必他五者佛度陀六者羅叉必七者師羅文伽八者婆訶諦九者婆羅提弗陀十者達摩邊伽是名為十如偈謂虛假光明四十種名字故云何為十真金剛心一者鳩摩羅伽二者須何伽一婆三者須那迦四者須陀洹五者斯陀含六者阿那含七者阿羅漢八者阿尼羅漢九者阿那訶訶十者阿訶羅弗是名為十如偈不動真金剛十種本名字故此五十中更復加婆伽婆佛陀應審觀察是名五十一種名字如偈及大極地故是名所依數故如是五十一種心中彼無超次第漸轉位安立屬當其相云何偈曰五十一位中如次無超轉一中具一切名為漸轉位論曰唯一行者五十一種別相位中回向趣入如其次第無超過法所以者何此門位量法如是故如偈五十一位中如次無超轉故如是行者以何行相而漸漸轉謂具具轉故云何名為具具轉相謂一信心位中具餘五十心而轉乃至一大極地位中具餘五十心而轉故若爾一物耶異物耶實是異物而一物故所以者何一信心中具一切位非餘位故而一信中具一切位同餘餘位中具一切位故以何義故一信心中具諸餘位更須漸轉具一中具而不能具多中具故是故須轉今此門中五十一中一切具具皆悉具足方名漸轉位故如偈一中具一切名為漸轉位故摩訶衍金剛種子修多羅中作如是説金剛道路足行行者以二大事而決定轉云何名為二決定轉一者遍度通達轉二者具具增長轉是名為二言遍度通達轉者通遍經過五十一種大道路故言具具增長轉者一一位中攝諸位故乃至廣説故如是已説無超次第漸轉門次當説無餘究竟總持門其相云何偈曰五十一位中隨其先得入攝一切一切名無餘究竟論曰有五十一別相位中或有行者以信趣入或有行者以真金地而趣入或有行者以大極地而趣入如是等諸行者隨其先得入位之量盡攝一切一切位地究竟無餘亦無移轉亦無出入一一白白是故説言總持門位如偈五十一位中隨其先得入攝一切一切名無餘究竟故難入未曾有會修多羅中作如是説回向則信心信心則佛地佛地則十地究竟有何次乃至廣説故如是已説無餘究竟總持門次當説周遍圓滿廣大門其相云何偈曰五十一種位無前後一時俱轉俱行故名周遍圓滿論曰五十一位無有前後一時俱轉一時俱行無有所餘亦五十一別相位中所有無量無邊諸位無有前後一時俱轉一時俱行無有所餘是故説言圓滿位焉如偈五十一種位無前後一時俱轉俱行故名周遍圓滿故法界法輪無盡中藏修多羅中作如是説爾時文殊師利聞世尊所説即從坐起合掌頂禮前白佛言世尊云何名為橫轉無向修道人者如宜世尊為諸大衆宣説開示如是大事於是世尊即告文殊師利言一種無二一道一區大地行者一切行道無前無後一時發起一時同轉一時住持一時證入一時安立是名橫轉無向道人乃至廣説故如是已説周遍圓滿廣大門次當説一切諸法俱非門其相云何偈曰諸無量無邊一切種種位皆悉非建立名俱非位地論曰今此偈中為明何義為欲現示此俱非門非因非果非位非地非有非無非名非義非事非理非壞非常非生非滅一切一切皆悉非故如偈諸無量無邊一切種種位皆悉非建立名俱非位地故若爾以何義故建立位名以其非義立為位故大明修多羅中作如是説無位位第一位乃至廣説故如是已説一切諸法俱非門次當説一切諸法俱是門其相云何偈曰一切種種法無非金剛身以一身義故名為俱是門論曰無量無邊一切位法一切皆悉是金剛身等無差別唯依一身是故説言俱是門焉所以者何今此門中無一一法而非金剛真實身故如偈一切種種法無非金剛身以一身義故名為俱是門故種金大地修多羅中作如是説無病道人唯見積影不見散身故金剛寶輪山王大決擇分第四如是已説一種金剛道路大決擇分次當説金剛寶輪山王大決擇分其相云何偈曰漸是盡滿非一時及前後與俱并俱非一異時處轉論曰今此偈中為明何義為欲現示一身金剛大力寶輪山王體中次第漸轉諸法等是無餘究竟周遍圓滿俱非絶離此五種位一時轉前後轉俱有轉俱非轉亦一時轉亦異時轉亦一處轉亦異處轉具足具足自在自在無所障礙故大嚴盡地虛空法界修多羅中作如是説復次龍明汝前所問云何名為金剛本身廣大地地無障無礙恆沙功德品者殊勝極妙不可思議不可思議五種金剛道路足行地地無盡中藏之根本自性出生增長所依止藏乃至廣説故
