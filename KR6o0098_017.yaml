body:
  text: 馬鳴菩薩造真諦三藏譯解脫山王大道路大決擇分第三十三如是已說解脫山王根本地地無礙自在大決擇分次當說解脫山王大道路大決擇分其相云何偈曰山王道路中前所說量中增空空有有位位轉勝生論曰就解脫山王大道路分中則有三轉云何為三一者空空轉十空無為一一各各生十空故二者有有轉十有無為一一各各生十有故三者位位轉五十一位一一各各生五十故是名為三取自相生非他相故如偈山王道路中前所說量中增空空有有位位轉勝生故餘種種門轉轉增數應廣通達廣大無盡解脫海海摩訶山王大決擇分第三十四如是已說解脫山王大道路大決擇分次當說廣大無盡解脫海海摩訶山王大決擇分其相云何偈曰前所說諸轉無有窮盡故論曰今此偈中為明何義為欲現示空生自空無有窮盡空生異空無有窮盡空生諸有無有窮盡有亦如是無有窮盡位亦如是無有窮盡重重無窮亂轉無窮無其邊際無其始終甚深甚深周遍周遍廣大轉行則是解脫海海山王無礙自在體相用故如偈前所說諸轉無有窮盡故故
